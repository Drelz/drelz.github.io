<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drelz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/style.css">
<style>
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,155,60,.10), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 32px;
  }
  h1{
    margin:0 0 40px;
    font-size:clamp(2rem,6vw,3rem);
    font-weight:700;
    letter-spacing:12px;
    text-transform:uppercase;
  }
  .selector{
    width:100%;
    max-width:900px;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
  }
  .choice{
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:18px;
    background:var(--surface);
    color:var(--text);
    text-decoration:none;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:transform .15s,border-color .15s,box-shadow .15s;
  }
  .choice:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 14px 38px rgba(0,0,0,.4),0 0 0 1px var(--accent-glow);
  }
  .choice:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:4px;
  }
  .image-frame{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(20px,5vw,48px);
    background:
      radial-gradient(circle at 50% 35%,rgba(200,155,60,.12),transparent 65%),
      var(--surface2);
  }
  .choice img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .choice-label{
    display:block;
    padding:16px 20px 18px;
    border-top:1px solid var(--border);
    font-size:1rem;
    font-weight:700;
    letter-spacing:1px;
    text-align:center;
    text-transform:uppercase;
  }
  footer{
    margin-top:auto;
    padding-top:48px;
    font-size:.78rem;
    color:var(--muted);
    text-align:center;
  }
  @media(max-width:640px){
    body{padding-top:40px}
    .selector{grid-template-columns:1fr;gap:20px}
    h1{margin-bottom:30px;letter-spacing:8px}
  }
</style>
</head>
<body>
  <h1>Drelz</h1>

  <main class="selector">
    <a class="choice" href="Games/index.html" aria-label="Open games">
      <div class="image-frame">
        <img src="Games/cat.jpg" alt="">
      </div>
      <span class="choice-label">Games</span>
    </a>

    <a class="choice" href="Mtg-Apps/index.html" aria-label="Open Magic: The Gathering apps">
      <div class="image-frame">
        <img src="mtg.png" alt="">
      </div>
      <span class="choice-label">MTG Apps</span>
    </a>
  </main>

  <footer>Drowsybeaver since forever...</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drelz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0c0e17;
    --surface:#181b2c;
    --surface2:#21253c;
    --border:#272c4e;
    --accent:#c89b3c;
    --accent2:#8b6914;
    --text:#e8e0d0;
    --muted:#6b7092;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(200,155,60,.10), transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 20px 40px;
  }
  h1{
    font-size:2.5rem;
    font-weight:700;
    letter-spacing:14px;
    text-transform:uppercase;
    margin:0 0 48px -14px;
    color:var(--text);
  }
  .apps{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .app-card{
    display:flex;
    align-items:center;
    gap:18px;
    padding:20px 22px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s, box-shadow .15s, transform .15s, background .15s;
  }
  .app-card:hover{
    border-color:var(--accent);
    background:var(--surface2);
    box-shadow:0 0 0 1px rgba(200,155,60,.35), 0 8px 24px rgba(0,0,0,.45);
    transform:translateY(-2px);
  }
  .app-em{
    font-size:1.7rem;
    line-height:1;
    flex-shrink:0;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:10px;
  }
  .app-body{flex:1;min-width:0}
  .app-body h2{font-size:1.05rem;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
  .app-body p{font-size:.83rem;color:var(--muted);line-height:1.5}
  .app-link{
    display:inline-block;
    margin-top:8px;
    font-size:.85rem;
    font-weight:600;
    color:var(--accent);
    letter-spacing:.5px;
  }
  footer{margin-top:auto;padding-top:56px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>
<body>
  <h1>Drelz</h1>

  <main class="apps">
    <a class="app-card" href="https://drelz.github.io/Mtg-Shadowboxing/mtg-shadowboxing.html" target="_blank" rel="noopener">
      <div class="app-em" aria-hidden="true">⚔️</div>
      <div class="app-body">
        <h2>MTG Shadowboxing</h2>
        <p>Solo goldfish &amp; deck-testing tool. Paste a decklist, then draw, mulligan, and play-test your game plan.</p>
        <span class="app-link">Open the app →</span>
      </div>
    </a>
  </main>

  <footer>Drowsybeaver since forever...</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maze</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(#cdeffd 0%, #b6e3c8 60%, #a5d8a0 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 10px; min-height: 100vh; overflow: hidden;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 640px; width: 100%; }

  .header-row { display: flex; align-items: center; justify-content: center; position: relative; gap: 10px; margin-bottom: 2px; width: 100%; }
  #backBtn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-size: 15px; padding: 8px 12px; }
  h1 { font-size: clamp(20px, 4.5vw, 28px); color: #4a3520; letter-spacing: 1px; }
  button {
    font-family: inherit; font-size: 15px; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer;
    background: #7a5c43; color: #fff8e7; padding: 8px 14px;
    box-shadow: 0 3px 0 #5c4430;
    transition: transform .06s ease, box-shadow .06s ease;
  }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 #5c4430; }
  button.active { background: #e08a3c; box-shadow: 0 3px 0 #a85f1f; }
  .star-pill {
    background: #e8c360; color: #6b4a21; font-weight: 800; font-size: 17px;
    padding: 7px 10px; border-radius: 12px; text-align: center;
    box-shadow: inset 0 0 0 2px #d4ae45;
  }
  #soundBtn, #newBtn { font-size: 15px; }
  button.data-size { padding: 9px 10px; }

  .panel {
    background: #fff8e7; border-radius: 18px; padding: 14px;
    box-shadow: inset 0 0 0 3px #d9c48f, 0 6px 16px rgba(60, 40, 10, .18);
    display: flex; flex-direction: column; gap: 10px; align-items: stretch;
    width: clamp(128px, 20vw, 156px);
    align-self: center;
  }
  .panel .star-pill { width: 100%; }
  .ability-pill {
    background: #e8d9b8; color: #5c4430; font-weight: 700; font-size: 13px;
    padding: 8px 8px; border-radius: 10px; text-align: center; line-height: 1.35;
    box-shadow: inset 0 0 0 2px #d4be8d;
    min-height: 36px; display: flex; align-items: center; justify-content: center;
    position: relative; cursor: help;
  }
  .ability-pill .ability-tip {
    position: absolute; top: calc(100% + 7px); left: 50%; transform: translateX(-50%);
    width: 220px; max-width: 70vw; text-align: left;
    background: #4a3520; color: #fff8e7;
    font-size: 12px; font-weight: 600; line-height: 1.45; letter-spacing: .2px;
    padding: 9px 11px; border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    z-index: 30; opacity: 0; visibility: hidden; pointer-events: none;
    white-space: normal;
    transition: opacity .15s ease, transform .15s ease;
  }
  .ability-pill .ability-tip::after {
    content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px; background: #4a3520;
  }
  .ability-pill:hover .ability-tip,
  .ability-pill:focus .ability-tip,
  .ability-pill:focus-within .ability-tip {
    opacity: 1; visibility: visible;
  }

  .board-holder { position: relative; }
  .grid {
    display: grid; background: #3d6b28; border-radius: 12px;
    padding: 5px; gap: 2px;
    box-shadow: inset 0 0 0 3px #2c4d1b, 0 8px 22px rgba(30, 60, 20, .25);
  }
  .tile {
    border-radius: 7px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .tile.grass {
    background:
      radial-gradient(circle at 26% 22%, rgba(255,255,255,.22) 0 9%, transparent 10%),
      radial-gradient(circle at 72% 66%, rgba(255,255,255,.14) 0 8%, transparent 9%),
      radial-gradient(circle at 64% 20%, rgba(255,255,255,.14) 0 7%, transparent 8%),
      linear-gradient(#86cf50, #66ad39);
    box-shadow: inset 0 0 5px rgba(38, 84, 22, .35);
  }
  .tile.path {
    background: linear-gradient(#f7e9c6, #efdcb4);
    box-shadow: inset 0 2px 3px rgba(120, 90, 40, .12);
  }
  .tile.dirt {
    background:
      radial-gradient(circle at 28% 30%, rgba(120, 80, 40, .2) 0 10%, transparent 11%),
      radial-gradient(circle at 72% 62%, rgba(120, 80, 40, .18) 0 8%, transparent 9%),
      linear-gradient(#d9b27a, #c49a63);
    box-shadow: inset 0 2px 3px rgba(110, 70, 30, .2);
  }
  .tile.wood {
    background:
      repeating-linear-gradient(90deg, rgba(90, 50, 20, .28) 0 4px, transparent 4px 12px),
      linear-gradient(#aa723f, #7e4e2a);
    box-shadow: inset 0 0 6px rgba(50, 25, 10, .5);
  }
  .tile.goal { box-shadow: inset 0 0 0 3px rgba(232, 165, 82, .75); }
  .tile.start { box-shadow: inset 0 0 0 3px rgba(120, 205, 120, .6); }
  .tile-emoji { font-size: calc(var(--cell) * .56); line-height: 1; z-index: 1; }
  .tile-emoji.goal-emoji { font-size: calc(var(--cell) * .62); }
  .star-item { animation: pop .3s ease; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .star-item.collected { animation: collect .45s ease forwards; }
  @keyframes collect { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0) rotate(180deg); opacity: 0; } }

  #player {
    position: absolute; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    transition: left .18s ease, top .18s ease;
    will-change: left, top;
    font-size: calc(var(--cell) * .72); line-height: 1;
  }
  #player.bump { animation: bump .18s ease; }
  #player.hop { animation: hop .32s ease; }
  #sprite { display: block; transition: transform .15s ease; }
  #dirArrow {
    position: absolute;
    font-size: calc(var(--cell) * .18); line-height: 1;
    color: rgba(255, 255, 255, .9); pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55), 0 0 4px rgba(0, 0, 0, .35);
    opacity: .9;
  }
  #dirArrow.f-up { top: -4px; left: 50%; transform: translateX(-50%); }
  #dirArrow.f-down { bottom: -4px; left: 50%; transform: translateX(-50%); }
  #dirArrow.f-left { left: -6px; top: 50%; transform: translateY(-50%); }
  #dirArrow.f-right { right: -6px; top: 50%; transform: translateY(-50%); }
  @keyframes bump { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-7%,0); } 75% { transform: translate(6%,0); } }
  @keyframes hop {
    0% { transform: translateY(0) scale(1,1); }
    35% { transform: translateY(-70%) scale(1,1); }
    60% { transform: translateY(-45%) scale(1.05,.85); }
    100% { transform: translateY(0) scale(1,1); }
  }

  .game-row { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 20px); }
  .pad {
    display: grid; grid-template-columns: repeat(3, var(--padbtn, 60px));
    grid-template-rows: repeat(2, var(--padbtn, 60px)); gap: 8px;
    align-self: center;
  }
  .pad button {
    font-size: calc(var(--padbtn, 60px) * .46); padding: 0;
    border-radius: 20px; background: #5b8a3c; box-shadow: 0 4px 0 #3f6427;
    display: flex; align-items: center; justify-content: center;
  }
  .pad button:active { transform: translateY(4px); box-shadow: 0 0 0 #3f6427; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .l { grid-column: 1; grid-row: 2; }
  .pad .d { grid-column: 2; grid-row: 2; }
  .pad .r { grid-column: 3; grid-row: 2; }

  .overlay {
    position: fixed; inset: 0; background: rgba(60, 40, 20, .55);
    display: none; align-items: center; justify-content: center; z-index: 50; opacity: 0;
    transition: opacity .25s ease;
  }
  .overlay.show { display: flex; opacity: 1; }
  .card {
    background: #fff8e7; border-radius: 22px; padding: 38px 52px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); border: 3px solid #8d6e63;
    transform: scale(.8); transition: transform .25s ease; max-width: 92vw;
  }
  .overlay.show .card { transform: scale(1); }
  .card h2 { font-size: clamp(38px, 10vw, 58px); color: #7a5c43; margin-bottom: 10px; }
  .card .score { font-size: 27px; color: #4a3520; font-weight: 800; margin: 10px 0 22px; line-height: 1.5; }
  .card .btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .card .btn-row button { font-size: 18px; padding: 12px 20px; }

  #charOverlay {
    align-items: stretch;
    background:
      radial-gradient(circle at 18% 22%, rgba(255, 209, 102, .16), transparent 32%),
      radial-gradient(circle at 82% 78%, rgba(134, 207, 80, .18), transparent 34%),
      rgba(48, 32, 16, .72);
    padding: 20px;
    overflow-y: auto;
  }
  .char-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 5vh, 42px); width: 100%; min-height: 100%;
  }
  .char-title {
    font-size: clamp(28px, 6.5vw, 52px); color: #fff8e7; letter-spacing: 1px;
    text-shadow: 0 3px 10px rgba(0, 0, 0, .45);
  }
  .char-grid { display: flex; gap: clamp(14px, 5vw, 64px); justify-content: center; flex-wrap: wrap; align-items: center; }
  .char-option {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: rgba(255, 248, 231, .10); border: 3px solid transparent; border-radius: 26px;
    padding: clamp(10px, 2.2vw, 20px) clamp(14px, 3vw, 30px);
    cursor: pointer; font-family: inherit;
    opacity: .42; transform: scale(.82);
    transition: transform .18s ease, opacity .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .char-option:hover { opacity: .65; }
  .char-option .char-emoji {
    font-size: clamp(56px, 14vw, 116px); line-height: 1;
    filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .35));
    transition: transform .18s ease;
  }
  .char-option .char-name {
    font-weight: 800; color: #fff8e7; font-size: clamp(16px, 3vw, 22px);
    letter-spacing: .5px; text-shadow: 0 2px 6px rgba(0, 0, 0, .4);
  }
  .char-option .char-tag {
    display: flex; align-items: center; gap: 6px;
    font-size: clamp(11px, 2.2vw, 14px); font-weight: 800; letter-spacing: .4px;
    color: rgba(255, 248, 231, .92);
    background: rgba(0, 0, 0, .24); padding: 3px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .char-option .char-tag .stars { display: inline-flex; gap: 1px; }
  .char-option .char-tag .stars i { font-style: normal; color: rgba(255, 248, 231, .35); }
  .char-option .char-tag .stars i.on { color: #ffd166; text-shadow: 0 0 6px rgba(255, 209, 102, .7); }
  .char-option .char-desc {
    font-size: clamp(11px, 2.2vw, 14px); color: rgba(255, 248, 231, .72);
    font-weight: 600; letter-spacing: .3px; text-align: center; line-height: 1.3;
  }
  .char-option.hl {
    opacity: 1; transform: scale(1.12); z-index: 2;
    background: rgba(255, 248, 231, .18);
    border-color: #ffd166;
    box-shadow: 0 0 0 4px rgba(255, 209, 102, .28), 0 14px 34px rgba(0, 0, 0, .4);
  }
  .char-option.hl .char-emoji { animation: bob 1.3s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .char-hint {
    font-size: clamp(13px, 3vw, 18px); color: rgba(255, 248, 231, .88); font-weight: 700;
    background: rgba(0, 0, 0, .32); padding: 10px 22px; border-radius: 999px;
    text-align: center; letter-spacing: .3px; line-height: 1.5;
  }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 60; pointer-events: none; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="header-row">
    <button id="backBtn" aria-label="Back to games">◀</button>
    <h1>Maze</h1>
  </header>

  <div class="game-row">
    <div class="panel" id="diffRow">
      <span class="star-pill">⭐ <span id="have">0</span>/<span id="total">0</span></span>
      <div class="ability-pill" id="abilityPill" tabindex="0">
        <span id="abilityPillText">No ability</span>
        <span class="ability-tip" id="abilityTip">No special ability — just find your way through the maze.</span>
      </div>
      <button class="data-size active" data-size="9">Easy</button>
      <button class="data-size" data-size="11">Medium</button>
      <button class="data-size" data-size="13">Hard</button>
      <button id="newBtn">🔄 New Maze</button>
      <button id="soundBtn">🔊</button>
    </div>
    <div class="board-holder" id="holder">
      <div class="grid" id="grid"></div>
      <div id="player"><span id="sprite">🦔</span><span id="dirArrow" class="f-down">▼</span></div>
    </div>
    <div class="pad" id="pad">
      <button class="up" data-dir="up">▲</button>
      <button class="l" data-dir="left">◀</button>
      <button class="d" data-dir="down">▼</button>
      <button class="r" data-dir="right">▶</button>
    </div>
  </div>
</div>

<div class="overlay show" id="charOverlay">
  <div class="char-screen">
    <h2 class="char-title">Choose your character</h2>
    <div class="char-grid" id="charGrid"></div>
    <div class="char-hint">◀ ▶ Use the arrow keys to choose<br>Press Space to start</div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="card">
    <h2>YAY! 🎉</h2>
    <div class="score">You found your way home!<br>⭐ <span id="finalStars">0</span> stars</div>
    <div class="btn-row">
      <button id="againBtn">🔄 New Maze</button>
      <button id="stayBtn">Keep Exploring</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var GRASS = "grass", PATH = "path", DIRT = "dirt";
  var GAP = 2, PAD = 5;
  var SIZES = { "9": 9, "11": 11, "13": 13 };
  var LOOP_CHANCE = 0.25;
  var TREE_RANGES = { "9": [2, 3], "11": [4, 6], "13": [7, 10] };

  var state = {
    rows: 9, cols: 9, pw: 4, ph: 4,
    cell: 0, step: 0, r: 0, c: 0,
    startR: 1, startC: 1, goalR: 7, goalC: 7,
    world: null, stars: {}, starTotal: 0, starHave: 0
  };
  var muted = false;
  var audioCtx = null;
  var facingRight = false;
  var facing = "down";
  var gameStarted = false;

  var characters = {
    hedgehog: {
      emoji: "🦔", name: "Hedgehog", stars: 1, tag: "Easy",
      desc: "Basic movement only",
      ability: "No ability", abilityIcon: "",
      tip: "No special ability — just find your way through the maze."
    },
    beaver: {
      emoji: "🦫", name: "Beaver", stars: 2, tag: "Medium",
      desc: "Bites through wooden walls",
      ability: "Bite walls", abilityIcon: "🪵",
      tip: "Press SPACE to bite through any wooden wall you are standing next to. Wood walls turn into dirt paths you can walk on."
    },
    rabbit: {
      emoji: "🐇", name: "Rabbit", stars: 3, tag: "Hard",
      desc: "Jumps over walls",
      ability: "Wall jump", abilityIcon: "⤴",
      tip: "Press SPACE to jump over the wall you are facing. The tile 2 squares beyond must be open for the jump to work."
    }
  };
  var charOrder = ["hedgehog", "beaver", "rabbit"];
  var charIndex = 0;
  var currentChar = "hedgehog";

  var gridEl = document.getElementById("grid");
  var holderEl = document.getElementById("holder");
  var playerEl = document.getElementById("player");
  var spriteEl = document.getElementById("sprite");
  var dirArrowEl = document.getElementById("dirArrow");
  var panelEl = document.getElementById("diffRow");
  var padEl = document.getElementById("pad");
  var haveEl = document.getElementById("have");
  var totalEl = document.getElementById("total");
  var winOverlay = document.getElementById("winOverlay");
  var charOverlay = document.getElementById("charOverlay");
  var finalStarsEl = document.getElementById("finalStars");
  var abilityPillTextEl = document.getElementById("abilityPillText");
  var abilityTipEl = document.getElementById("abilityTip");

  function buildCharPicker() {
    var grid = document.getElementById("charGrid");
    grid.innerHTML = "";
    charOrder.forEach(function (key, i) {
      var ch = characters[key];
      var btn = document.createElement("button");
      btn.className = "char-option";
      btn.dataset.char = key;
      btn.setAttribute("aria-label", ch.name);
      btn.setAttribute("aria-selected", i === 0 ? "true" : "false");
      if (i === 0) btn.classList.add("hl");

      var em = document.createElement("span");
      em.className = "char-emoji";
      em.textContent = ch.emoji;
      btn.appendChild(em);

      var nm = document.createElement("span");
      nm.className = "char-name";
      nm.textContent = ch.name;
      btn.appendChild(nm);

      var tag = document.createElement("span");
      tag.className = "char-tag";
      var stars = document.createElement("span");
      stars.className = "stars";
      for (var s = 1; s <= 3; s++) {
        var st = document.createElement("i");
        st.textContent = s <= ch.stars ? "★" : "☆";
        if (s <= ch.stars) st.className = "on";
        stars.appendChild(st);
      }
      tag.appendChild(document.createTextNode(ch.tag));
      tag.appendChild(stars);
      btn.appendChild(tag);

      var desc = document.createElement("span");
      desc.className = "char-desc";
      desc.textContent = ch.desc;
      btn.appendChild(desc);

      grid.appendChild(btn);
    });
  }

  function abilityHint() {
    var ch = characters[currentChar];
    abilityPillTextEl.textContent = ch.abilityIcon ? ch.abilityIcon + " " + ch.ability : ch.ability;
    abilityTipEl.textContent = ch.tip;
  }

  buildCharPicker();
  abilityHint();

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
  }

  function beep(freq, delay, dur, type, vol) {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime + delay;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.25, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  function sStar() { beep(880, 0, .09, "sine", .22); beep(1318, .1, .14, "sine", .22); }
  function sWall() { beep(150, 0, .08, "square", .1); }
  function sMove() { beep(340, 0, .03, "sine", .05); }
  function sWin() { [523, 659, 784, 1046].forEach(function (f, i) { beep(f, i * 0.14, .22, "sine", .22); }); }
  function sClick() { beep(500, 0, .05, "sine", .12); }
  function sChomp() { beep(220, 0, .12, "square", .18); beep(170, .1, .15, "sawtooth", .14); }
  function sJump() { beep(300, 0, .06, "sine", .18); beep(520, .08, .07, "sine", .18); beep(760, .16, .1, "sine", .16); }
  function sFail() { beep(140, 0, .12, "square", .1); }

  function makeMaze(rows, cols) {
    var m = [];
    var r, c;
    for (r = 0; r < rows; r++) {
      m.push([]);
      for (c = 0; c < cols; c++) m[r].push({ n: 1, e: 1, s: 1, w: 1, v: 0 });
    }
    var DIRS = { n: [-1, 0, "s"], e: [0, 1, "w"], s: [1, 0, "n"], w: [0, -1, "e"] };
    var order = ["n", "e", "s", "w"];
    var stack = [[0, 0]];
    m[0][0].v = 1;
    while (stack.length) {
      var cur = stack[stack.length - 1];
      var rr = cur[0], cc = cur[1];
      var nb = order.slice();
      for (var i = nb.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = nb[i]; nb[i] = nb[j]; nb[j] = t; }
      var moved = false;
      for (i = 0; i < nb.length; i++) {
        var d = nb[i], dref = DIRS[d];
        var nr = rr + dref[0], nc = cc + dref[1];
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || m[nr][nc].v) continue;
        m[rr][cc][d] = 0;
        m[nr][nc][dref[2]] = 0;
        m[nr][nc].v = 1;
        stack.push([nr, nc]);
        moved = true;
        break;
      }
      if (!moved) stack.pop();
    }
    return m;
  }

  function addLoops(maze, rows, cols, chance) {
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        if (c < cols - 1 && maze[r][c].e === 1 && Math.random() < chance) {
          maze[r][c].e = 0;
          maze[r][c + 1].w = 0;
        }
        if (r < rows - 1 && maze[r][c].s === 1 && Math.random() < chance) {
          maze[r][c].s = 0;
          maze[r + 1][c].n = 0;
        }
      }
    }
  }

  function computeCell() {
    var padBtn = Math.round(Math.min(64, Math.max(46, Math.min(window.innerWidth * 0.055, 64))));
    document.documentElement.style.setProperty("--padbtn", padBtn + "px");
    var panelW = panelEl.offsetWidth || 140;
    var padW = padEl.offsetWidth || 196;
    var availW = Math.min(window.innerWidth - 20 - panelW - padW - 48, 1100);
    var availH = window.innerHeight - 64;
    var avail = Math.max(160, Math.min(availW, availH));
    var inner = avail - 2 * PAD - (state.cols - 1) * GAP;
    var cell = Math.floor(inner / state.cols);
    if (cell < 16) cell = 16;
    if (cell > 160) cell = 160;
    return cell;
  }

  function treeSpots(world, rows, cols) {
    var spots = [];
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (var r = 1; r < rows - 1; r++) {
      for (var c = 1; c < cols - 1; c++) {
        if (world[r][c].kind !== GRASS) continue;
        var pathNeighbors = 0;
        for (var d = 0; d < dirs.length; d++) {
          if (world[r + dirs[d][0]][c + dirs[d][1]].kind === PATH) pathNeighbors++;
        }
        if (pathNeighbors >= 2) spots.push([r, c]);
      }
    }
    return spots;
  }

  function placeTrees(world, rows, cols) {
    var spots = treeSpots(world, rows, cols);
    for (var i = spots.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var spot = spots[i]; spots[i] = spots[j]; spots[j] = spot;
    }
    var range = TREE_RANGES[state.cols] || TREE_RANGES["9"];
    var target = range[0] + Math.floor(Math.random() * (range[1] - range[0] + 1));
    var count = Math.min(target, spots.length);
    for (i = 0; i < count; i++) world[spots[i][0]][spots[i][1]].wood = true;
    return count;
  }

  function buildWorld() {
    var cols = state.cols, rows = state.rows;
    state.pw = Math.floor((cols - 1) / 2);
    state.ph = Math.floor((rows - 1) / 2);

    var world, treeCount = 0;
    do {
      var maze = makeMaze(state.ph, state.pw);
      addLoops(maze, state.ph, state.pw, LOOP_CHANCE);

      world = [];
      for (var r = 0; r < rows; r++) {
        world.push([]);
        for (var c = 0; c < cols; c++) world[r].push({ kind: GRASS, wood: false });
      }
      for (var pr = 0; pr < state.ph; pr++) {
        for (var pc = 0; pc < state.pw; pc++) {
          var wr = 1 + 2 * pr, wc = 1 + 2 * pc;
          world[wr][wc] = { kind: PATH, wood: false };
          if (maze[pr][pc].e === 0) world[wr][wc + 1] = { kind: PATH, wood: false };
          if (maze[pr][pc].s === 0) world[wr + 1][wc] = { kind: PATH, wood: false };
        }
      }
      treeCount = currentChar === "beaver" ? placeTrees(world, rows, cols) : 0;
    } while (currentChar === "beaver" && treeCount < 2);

    state.world = world;
    state.startR = 1; state.startC = 1;
    state.goalR = 1 + 2 * (state.ph - 1);
    state.goalC = 1 + 2 * (state.pw - 1);
    state.r = state.startR; state.c = state.startC;
  }

  function safePathCells() {
    var cols = state.cols, rows = state.rows;
    var start = state.startR * cols + state.startC;
    var goal = state.goalR * cols + state.goalC;
    var seen = {};
    var queue = [start];
    seen[start] = true;
    for (var qi = 0; qi < queue.length; qi++) {
      var cur = queue[qi];
      var r = Math.floor(cur / cols), c = cur % cols;
      var steps = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (var s = 0; s < steps.length; s++) {
        var nr = r + steps[s][0], nc = c + steps[s][1];
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        var idx = nr * cols + nc;
        if (idx === goal || seen[idx]) continue;
        if (state.world[nr][nc].kind !== PATH) continue;
        seen[idx] = true;
        queue.push(idx);
      }
    }
    var cells = [];
    for (var cr = 0; cr < rows; cr++) {
      for (var cc = 0; cc < cols; cc++) {
        var id = cr * cols + cc;
        if (id !== start && seen[id] && state.world[cr][cc].kind === PATH) cells.push(id);
      }
    }
    return cells;
  }

  function placeStars() {
    var pathCells = safePathCells();
    for (var i = pathCells.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pathCells[i]; pathCells[i] = pathCells[j]; pathCells[j] = t;
    }
    var target = state.pw * state.ph <= 16 ? 3 : state.pw * state.ph <= 25 ? 4 : 6;

    state.stars = {};
    var placed = 0;
    for (i = 0; i < pathCells.length && placed < target; i++) {
      state.stars[pathCells[i]] = true;
      placed++;
    }
    state.starTotal = placed;
    state.starHave = 0;
  }

  function buildBoard() {
    buildWorld();
    placeStars();
    state.cell = computeCell();
    state.step = state.cell + GAP;

    var cols = state.cols, rows = state.rows;
    gridEl.style.gridTemplateColumns = "repeat(" + cols + ", " + state.cell + "px)";
    gridEl.style.gridTemplateRows = "repeat(" + rows + ", " + state.cell + "px)";
    var boardW = cols * state.cell + (cols - 1) * GAP + 2 * PAD;
    var boardH = rows * state.cell + (rows - 1) * GAP + 2 * PAD;
    holderEl.style.width = boardW + "px";
    holderEl.style.height = boardH + "px";
    holderEl.style.setProperty("--cell", state.cell + "px");
    playerEl.style.width = state.cell + "px";
    playerEl.style.height = state.cell + "px";
    playerEl.style.transition = "none";
    facingRight = false;
    facing = "down";
    updateDirArrow();
    applyFacing();
    positionPlayer(true);

    gridEl.innerHTML = "";
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var tile = document.createElement("div");
        var cell = state.world[r][c];
        var cls = cell.kind === GRASS ? "tile grass" : (cell.kind === DIRT ? "tile dirt" : "tile path");
        if (cell.wood) cls += " wood";
        tile.className = cls;

        var idx = r * cols + c;
        if (idx === startIdx()) tile.classList.add("start");
        if (idx === goalIdx()) {
          tile.classList.add("goal");
          var goalEmoji = document.createElement("div");
          goalEmoji.className = "tile-emoji goal-emoji";
          goalEmoji.textContent = "🛖";
          tile.appendChild(goalEmoji);
        }
        if (state.stars[idx]) {
          var star = document.createElement("div");
          star.className = "tile-emoji star-item";
          star.textContent = "⭐";
          star.dataset.idx = idx;
          tile.appendChild(star);
        }
        gridEl.appendChild(tile);
      }
    }

    haveEl.textContent = "0";
    totalEl.textContent = state.starTotal;
    requestAnimationFrame(function () { playerEl.style.transition = "left .18s ease, top .18s ease"; });
  }

  function startIdx() { return state.startR * state.cols + state.startC; }
  function goalIdx() { return state.goalR * state.cols + state.goalC; }

  function positionPlayer(instant) {
    var left = state.c * state.step + PAD;
    var top = state.r * state.step + PAD;
    if (instant) { playerEl.style.transition = "none"; }
    playerEl.style.left = left + "px";
    playerEl.style.top = top + "px";
    if (instant) { requestAnimationFrame(function () { playerEl.style.transition = "left .18s ease, top .18s ease"; }); }
  }

  var moveBy = { up: [-1, 0], right: [0, 1], down: [1, 0], left: [0, -1] };

  function isOpen(r, c) {
    var cell = state.world[r] && state.world[r][c];
    return !!cell && cell.kind !== GRASS;
  }

  function applyFacing() {
    spriteEl.style.transform = facingRight ? "scaleX(-1)" : "scaleX(1)";
  }

  function faceDirection(dir) {
    if (dir === "right") facingRight = true;
    else if (dir === "left") facingRight = false;
    else facingRight = !facingRight;
    facing = dir;
    updateDirArrow();
    applyFacing();
  }

  function updateDirArrow() {
    var a = { up: "▲", right: "▶", down: "▼", left: "◀" };
    dirArrowEl.textContent = a[facing] || "▼";
    dirArrowEl.classList.remove("f-up", "f-down", "f-left", "f-right");
    dirArrowEl.classList.add("f-" + facing);
  }

  function bump() {
    playerEl.classList.remove("bump");
    void playerEl.offsetWidth;
    playerEl.classList.add("bump");
  }

  function arrive(nr, nc, dir) {
    state.r = nr; state.c = nc;
    faceDirection(dir);
    positionPlayer(false);
    sMove();

    var idx = nr * state.cols + nc;
    if (state.stars[idx]) {
      delete state.stars[idx];
      state.starHave++;
      haveEl.textContent = state.starHave;
      sStar();
      var starEl = gridEl.querySelector('.star-item[data-idx="' + idx + '"]');
      if (starEl) starEl.classList.add("collected");
    }

    if (idx === goalIdx()) {
      setTimeout(win, 300);
    }
  }

  function move(dir) {
    if (winOverlay.classList.contains("show") || charOverlay.classList.contains("show") || !gameStarted) return;
    ensureAudio();
    var d = moveBy[dir];
    var nr = state.r + d[0], nc = state.c + d[1];
    if (nr < 0 || nr >= state.rows || nc < 0 || nc >= state.cols || !isOpen(nr, nc)) {
      faceDirection(dir);
      bump();
      sWall();
      return;
    }
    arrive(nr, nc, dir);
  }

  function win() {
    finalStarsEl.textContent = state.starHave;
    sWin();
    winOverlay.classList.add("show");
    setTimeout(confetti, 200);
  }

  function confetti() {
    var colors = ["#ff8fa3", "#ffd166", "#06d6a0", "#8ecae6", "#c77dff", "#ffb703", "#ef476f"];
    for (var i = 0; i < 90; i++) {
      var el = document.createElement("div");
      el.className = "confetti";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animation = "fall " + (2 + Math.random() * 3) + "s " + (Math.random() * 1.5) + "s ease-in forwards";
      document.body.appendChild(el);
      (function (e) { setTimeout(function () { e.remove(); }, 6000); })(el);
    }
  }
  var confettiKey = document.createElement("style");
  confettiKey.textContent = "@keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(115vh) rotate(760deg); opacity: .2; } }";
  document.head.appendChild(confettiKey);

  function beaverBite() {
    ensureAudio();
    var bitten = [];
    var keys = ["up", "right", "down", "left"];
    for (var i = 0; i < keys.length; i++) {
      var d = moveBy[keys[i]];
      var nr = state.r + d[0], nc = state.c + d[1];
      if (nr < 0 || nr >= state.rows || nc < 0 || nc >= state.cols) continue;
      var cell = state.world[nr][nc];
      if (cell.kind === GRASS && cell.wood) {
        cell.kind = DIRT;
        cell.wood = false;
        bitten.push(nr * state.cols + nc);
      }
    }
    if (bitten.length === 0) { bump(); sFail(); return; }
    sChomp();
    for (i = 0; i < bitten.length; i++) {
      var tile = gridEl.children[bitten[i]];
      if (tile) tile.className = "tile dirt";
    }
  }

  function rabbitJump() {
    ensureAudio();
    var d = moveBy[facing];
    var r1 = state.r + d[0], c1 = state.c + d[1];
    var r2 = state.r + 2 * d[0], c2 = state.c + 2 * d[1];
    if (r1 < 0 || r1 >= state.rows || c1 < 0 || c1 >= state.cols) { bump(); sFail(); return; }
    if (isOpen(r1, c1)) { bump(); sFail(); return; }
    if (r2 < 0 || r2 >= state.rows || c2 < 0 || c2 >= state.cols || !isOpen(r2, c2)) { bump(); sFail(); return; }
    playerEl.classList.add("hop");
    sJump();
    arrive(r2, c2, facing);
    setTimeout(function () { playerEl.classList.remove("hop"); }, 340);
  }

  var abilities = {
    hedgehog: null,
    beaver: beaverBite,
    rabbit: rabbitJump
  };

  function useAbility() {
    var ab = abilities[currentChar];
    if (ab) ab();
  }

  function highlightChar() {
    var opts = charOverlay.querySelectorAll(".char-option");
    for (var i = 0; i < opts.length; i++) {
      var on = i === charIndex;
      opts[i].classList.toggle("hl", on);
      opts[i].setAttribute("aria-selected", on ? "true" : "false");
    }
  }

  function moveHighlight(step) {
    charIndex = (charIndex + step + charOrder.length) % charOrder.length;
    highlightChar();
    sClick();
  }

  function selectChar() {
    ensureAudio();
    sClick();
    currentChar = charOrder[charIndex];
    spriteEl.textContent = characters[currentChar].emoji;
    abilityHint();
    gameStarted = true;
    charOverlay.classList.remove("show");
    buildBoard();
  }

  document.addEventListener("keydown", function (e) {
    if (charOverlay.classList.contains("show")) {
      if (e.key === "ArrowLeft") { e.preventDefault(); moveHighlight(-1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); moveHighlight(1); }
      else if (e.key === " " || e.key === "Spacebar" || e.key === "Enter") { e.preventDefault(); selectChar(); }
      return;
    }
    var map = { ArrowUp: "up", ArrowRight: "right", ArrowDown: "down", ArrowLeft: "left" };
    if (map[e.key]) { e.preventDefault(); move(map[e.key]); }
    else if (e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      if (!gameStarted || winOverlay.classList.contains("show")) return;
      useAbility();
    }
  });

  padEl.addEventListener("pointerdown", function (e) {
    var btn = e.target.closest("button[data-dir]");
    if (btn) { e.preventDefault(); move(btn.dataset.dir); }
  });

  charOverlay.addEventListener("click", function (e) {
    var opt = e.target.closest("button[data-char]");
    if (!opt) return;
    var idx = Array.prototype.indexOf.call(opt.parentNode.children, opt);
    if (idx >= 0) charIndex = idx;
    selectChar();
  });

  document.getElementById("backBtn").addEventListener("click", function () { sClick(); window.location.href = "../index.html"; });
  document.getElementById("newBtn").addEventListener("click", function () { sClick(); buildBoard(); });
  document.getElementById("againBtn").addEventListener("click", function () { winOverlay.classList.remove("show"); sClick(); buildBoard(); });
  document.getElementById("stayBtn").addEventListener("click", function () { winOverlay.classList.remove("show"); sClick(); });

  document.getElementById("soundBtn").addEventListener("click", function () {
    ensureAudio();
    muted = !muted;
    this.textContent = muted ? "🔇" : "🔊";
    if (!muted) sClick();
  });

  document.getElementById("diffRow").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-size]");
    if (!btn) return;
    sClick();
    state.rows = state.cols = SIZES[btn.dataset.size];
    document.querySelectorAll("#diffRow button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    winOverlay.classList.remove("show");
    buildBoard();
  });

  window.addEventListener("resize", function () { if (gameStarted) buildBoard(); });
  window.addEventListener("load", function () { if (gameStarted) buildBoard(); });
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image-Retriever — MTG Card Lookup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Image-Retriever</h1>
    <p class="subtitle">Paste a list of Magic: The Gathering cards — one per line, <code>Card Name, SET</code> — to pull their full PNG images.</p>

    <form id="lookup-form">
      <label for="card-input">Card list</label>
      <textarea id="card-input" rows="10" placeholder="Lightning Bolt, LEA&#10;Brainstorm, ICE&#10;Tarmogoyf, MOR" spellcheck="false"></textarea>
      <button type="submit" id="lookup-btn">Look up images</button>
      <span id="status" role="status" aria-live="polite"></span>
    </form>

    <section id="results" aria-label="Results" hidden>
      <h2 id="results-title"></h2>
      <button id="copy-csv" hidden>Copy CSV</button>
      <pre id="csv-output"></pre>
    </section>

    <section id="not-found" aria-label="Not found" hidden>
      <h2 id="not-found-title"></h2>
      <p class="hint">These lines could not be matched. Fix the names and paste them back into the box above.</p>
      <button id="copy-not-found" hidden>Copy missing lines</button>
      <pre id="not-found-output"></pre>
    </section>
  </main>

  <footer class="site-footer">Image-Retriever v1.3.0</footer>

  <script src="app.js"></script>
</body>
</html>
